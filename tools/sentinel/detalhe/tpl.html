<!doctype html><body style="margin:0;background:#8fa3bd"><canvas id=c width=900 height=900></canvas><script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const gl=document.getElementById('c').getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
const VS=`#version 300 es
precision highp float;layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;layout(location=2) in vec2 aUV;layout(location=3) in float aM;
uniform mat4 uVP;out vec2 vUV;out float vMet;out vec3 vN;out vec3 vP;
void main(){vP=aP;vN=aN;vUV=aUV;vMet=aM;gl_Position=uVP*vec4(aP,1.);}`;
const FS=`%FS%`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))document.title='ERR '+gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const vb=b64('%VB%'),ib=b64('%IB%');
const vao=gl.createVertexArray();gl.bindVertexArray(vao);const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,vb,gl.STATIC_DRAW);
[[0,3,0],[1,3,12],[2,2,24],[3,1,32]].forEach(([l,n,o])=>{gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,36,o)});
const ibf=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibf);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,ib,gl.STATIC_DRAW);const NI=ib.byteLength/4;
let ready=0;function tex(unit,mime,s){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);ready++};im.src='data:'+mime+';base64,'+s}
tex(0,'image/jpeg','%ALB%');tex(1,'image/png','%NRM%');
gl.uniform1i(gl.getUniformLocation(pr,'uTex'),0);gl.uniform1i(gl.getUniformLocation(pr,'uNrm'),1);
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return [t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]}
function look(e,c){let f=[c[0]-e[0],c[1]-e[1],c[2]-e[2]];let l=Math.hypot(...f);f=f.map(x=>x/l);let s=[f[1]*0-f[2]*1,f[2]*0-f[0]*0,f[0]*1-f[1]*0];s=[-f[2],0,f[0]];l=Math.hypot(...s);s=s.map(x=>x/l);const u=[s[1]*f[2]-s[2]*f[1],s[2]*f[0]-s[0]*f[2],s[0]*f[1]-s[1]*f[0]];
return [s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-(s[0]*e[0]+s[1]*e[1]+s[2]*e[2]),-(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]),(f[0]*e[0]+f[1]*e[1]+f[2]*e[2]),1]}
function mul(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o}
window.draw=(yaw,pitch,dist,tg)=>{gl.viewport(0,0,900,900);gl.clearColor(.56,.64,.74,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
const e=[tg[0]+dist*Math.sin(yaw)*Math.cos(pitch),tg[1]+dist*Math.sin(pitch),tg[2]+dist*Math.cos(yaw)*Math.cos(pitch)];
const vp=mul(persp(0.9,1,0.02,50),look(e,tg));gl.useProgram(pr);gl.uniformMatrix4fv(gl.getUniformLocation(pr,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(pr,'uCam'),e);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,NI,gl.UNSIGNED_INT,0)}
</script>
