<div id="app">
  <header id="top">
    <div class="brand"><span class="orn"></span><span>Visualizador</span><em>v99</em><span class="orn"></span></div>
    <nav id="chars" class="glass" aria-label="Personagem">
      <button class="char on" data-id="guerreiro"><span class="em"><svg class="i"><use href="#i-axe"/></svg></span><span><b>Guerreiro</b><small>Dual Axe · Kit Brutal</small></span></button>
      <button class="char" data-id="mercenario"><span class="em"><svg class="i"><use href="#i-swords"/></svg></span><span><b>Mercenário</b><small>Dual Blade</small></span></button>
    </nav>
    <div id="now"><span id="nowName">—</span><span id="nowMeta"></span></div>
  </header>

  <button id="opener" class="glass" aria-label="Abrir painel"><svg class="i"><use href="#i-menu"/></svg></button>

  <div id="dock">
    <div id="transport" class="glass">
      <div class="seekrow"><span class="tm" id="tNow">0.00</span><input id="seekbar" type="range" min="0" max="1000" value="0" aria-label="Linha do tempo"><span class="tm r" id="tDur">0.00</span></div>
      <div class="ctlrow">
        <button class="cb" id="bPrev" aria-label="Animação anterior"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="cb big" id="bPlay" aria-label="Tocar/pausar"><svg class="i"><use href="#i-pause"/></svg></button>
        <button class="cb" id="bNext" aria-label="Próxima animação"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="cb on" id="bLoop" aria-label="Repetir"><svg class="i"><use href="#i-loop"/></svg></button>
        <button class="cb chip" id="bSpd" aria-label="Velocidade">1×</button>
        <button class="cb" id="bCam" aria-label="Resetar câmera"><svg class="i"><use href="#i-cam"/></svg></button>
      </div>
    </div>

    <section id="sheet" class="glass">
      <div id="tabs">
        <button class="tab on" data-tab="anim"><svg class="i"><use href="#i-list"/></svg><span>Animações</span></button>
        <button class="tab" data-tab="skills"><svg class="i"><use href="#i-bolt"/></svg><span>Skills</span></button>
        <button class="tab" data-tab="cfg"><svg class="i"><use href="#i-sliders"/></svg><span>Ajustes</span></button>
        <button id="fold" aria-label="Abrir/fechar painel"><svg class="i"><use href="#i-chev"/></svg></button>
        <button class="close" id="shut" aria-label="Fechar painel"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="panels">
        <div class="pane on" id="pAnim">
          <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar animação…" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="qx" aria-label="Limpar"><svg class="i"><use href="#i-x"/></svg></button></label>
          <div id="chipbar"></div>
          <div id="animlist"></div>
        </div>
        <div class="pane" id="pSkills">
          <div id="kitgrid"></div>
          <div id="skinfo"></div>
        </div>
        <div class="pane" id="pCfg"><div id="cfg"></div></div>
      </div>
    </section>
  </div>
</div>
